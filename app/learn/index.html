<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tyro.cell — Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF9; --ink:#17191C; --text-1:#40474F; --text-2:#5F646B; --text-3:#6B7076;
  --muted:#9A9EA4; --hint:#B9BCC1;
  --line-1:#EBE8E4; --line-2:#EFECE8; --line-3:#F3F1ED; --line-4:#E4E1DC;
  --brand:#0A0A0A; --brand-soft:#2E2E33;
  --green:#0F7A48; --green-dark:#0F7A48; --green-tint:#F2FAF6; --green-select:#DCDCE0;
  --amber:#8A6B12; --amber-tint:#FDF8E8; --amber-line:#DFC98A;
  --blue:#2B6CB0; --blue-tint:#E8F0FA;
  --red:#A4463C; --red-tint:#FBEFEC;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Consolas','Menlo',monospace;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;align-items:center;
  padding:32px 20px 20px;overflow-x:hidden;
}

/* --- Top nav --- */
.topnav{
  display:flex;align-items:center;gap:10px;width:100%;max-width:800px;margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;letter-spacing:-.2px;cursor:pointer;text-decoration:none;color:var(--ink)}
.brand-mark{display:block;flex:none}
.brand .dot{color:var(--muted);font-weight:500}
.topnav .eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:auto}

/* --- Stage --- */
.stage{
  width:100%;max-width:800px;
  background:#fff;border:1px solid var(--line-1);border-radius:var(--r-lg);
  overflow:hidden;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);
}

/* --- Formula bar --- */
.formula-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;border-bottom:1px solid var(--line-1);
  background:var(--paper);min-height:48px;
}
.formula-bar .fx{
  font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;
  background:var(--line-3);padding:3px 7px;border-radius:4px;flex-shrink:0;
}
.formula-bar .formula-text{
  font:500 14px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;
  min-height:20px;
}
.formula-bar .formula-text .typing-cursor{
  display:inline-block;width:2px;height:16px;background:var(--brand);
  vertical-align:text-bottom;animation:blink .6s step-end infinite;margin-left:1px;
}
@keyframes blink{50%{opacity:0}}

/* Syntax coloring */
.f-fn{color:var(--green);font-weight:700}
.f-ref{color:var(--blue)}
.f-num{color:var(--amber)}
.f-str{color:var(--red)}
.f-dim{color:var(--hint)}

/* --- Sheet area --- */
.sheet-area{
  padding:24px 20px;position:relative;overflow-x:auto;
}
.sheet{
  width:100%;border-collapse:collapse;
  font:400 13.5px var(--mono);font-variant-numeric:tabular-nums;
}
.sheet th{
  font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);background:var(--paper);padding:7px 14px;
  border:1px solid var(--line-1);text-align:center;
}
.sheet th.rh{width:32px;color:var(--hint);font-size:10px}
.sheet td{
  padding:9px 14px;border:1px solid var(--line-1);background:#fff;
  transition:background .5s ease,box-shadow .5s ease,color .4s ease;
  position:relative;white-space:nowrap;
}
.sheet td.col-a{font-weight:600;color:var(--ink)}

.sheet .gap-row td{border:none;background:transparent;padding:6px 0}

/* --- Cell animation states --- */
.sheet td.searching{
  background:var(--blue-tint);
  box-shadow:inset 0 0 0 2px var(--blue);
  transition:background .25s,box-shadow .25s;
}
.sheet td.not-match{
  background:#fff;box-shadow:none;
  transition:background .3s .15s,box-shadow .2s;
}
.sheet td.found{
  background:var(--green-tint);
  box-shadow:inset 0 0 0 2.5px var(--green),0 0 16px rgba(22,160,92,.15);
  color:var(--green-dark);font-weight:700;
}
.sheet td.col-highlight{
  background:var(--amber-tint);
  box-shadow:inset 0 0 0 1.5px var(--amber-line);
}
.sheet td.result-glow{
  background:var(--green-tint);
  box-shadow:inset 0 0 0 2.5px var(--green),0 0 20px rgba(22,160,92,.2);
  color:var(--green-dark);font-weight:700;
}
.sheet td.lookup-hl{
  background:var(--amber-tint);
  box-shadow:inset 0 0 0 2px var(--amber-line);
}
.sheet td.range-hl{
  box-shadow:inset 0 0 0 1px rgba(37,99,235,.3);
}
.sheet td.target-cell{
  background:var(--line-3);
}

/* --- Animated cursor --- */
.cursor-layer{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:10;
}
.anim-cursor{
  position:absolute;width:20px;height:20px;
  opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}
.anim-cursor.visible{opacity:1}
.anim-cursor svg{width:20px;height:20px}

/* --- Value float animation --- */
.float-val{
  position:absolute;
  font:700 14px var(--mono);color:var(--green-dark);
  pointer-events:none;z-index:20;
  opacity:0;
}
.float-val.animating{
  opacity:1;
  transition:transform .8s cubic-bezier(.34,.01,.21,1),opacity .6s ease;
}
.float-val.fade-out{
  opacity:0;
  transition:opacity .3s ease;
}

/* --- Subtitle --- */
.subtitle-area{
  padding:20px 28px;min-height:80px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-top:1px solid var(--line-1);background:var(--paper);
}
.subtitle-text{
  font:400 15px/1.65 var(--sans);color:var(--text-1);max-width:620px;
  opacity:0;transform:translateY(6px);
  transition:opacity .4s ease,transform .4s ease;
}
.subtitle-text.visible{opacity:1;transform:translateY(0)}

/* --- Transport --- */
.transport{
  padding:14px 20px;display:flex;align-items:center;gap:14px;
  border-top:1px solid var(--line-1);
}
.play-btn{
  width:38px;height:38px;border-radius:50%;border:none;
  background:var(--brand);color:#fff;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .12s;
}
.play-btn:hover{background:var(--brand-soft)}
.play-btn:active{transform:scale(.93)}
.play-btn:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.play-btn svg{width:16px;height:16px;fill:currentColor;pointer-events:none}

.progress-track{
  flex:1;height:5px;background:var(--line-2);border-radius:3px;
  overflow:hidden;cursor:pointer;position:relative;
}
.progress-fill{
  height:100%;background:var(--brand);border-radius:3px;
  width:0%;transition:width .35s ease;
}

.step-label{
  font:500 12px var(--mono);color:var(--muted);flex-shrink:0;
  min-width:56px;text-align:right;font-variant-numeric:tabular-nums;
}
.speed-btn{
  background:none;border:1px solid var(--line-4);color:var(--text-2);
  font:600 11px var(--mono);padding:4px 10px;border-radius:var(--r-pill);
  cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s;
}
.speed-btn:hover{color:var(--ink);border-color:var(--muted)}
.speed-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* --- Error state --- */
.error-msg{
  padding:60px 28px;text-align:center;
  font:400 15px/1.6 var(--sans);color:var(--text-2);
}
.error-msg code{
  font:500 14px var(--mono);color:var(--ink);background:var(--line-3);
  padding:2px 8px;border-radius:4px;
}

/* --- Responsive --- */
@media(max-width:580px){
  body{padding:16px 12px 12px}
  .stage{border-radius:var(--r-md)}
  .sheet{font-size:12px}
  .sheet td,.sheet th{padding:7px 8px}
  .formula-bar{padding:10px 14px}
  .formula-bar .formula-text{font-size:12.5px}
  .subtitle-text{font-size:14px}
  .sheet-area{padding:16px 12px}
}
@media(prefers-reduced-motion:reduce){
  .sheet td,.subtitle-text,.anim-cursor,.progress-fill,.float-val{transition:none!important}
  .formula-bar .typing-cursor{animation:none}
}
</style>
</head>
<body>

<div class="topnav">
  <a class="brand" href="../index.html" target="_top">
    <svg class="brand-mark" viewBox="124 136 366 280" height="20" width="26" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" aria-hidden="true"><rect x="202" y="216" width="270" height="182"/><path d="M193 145V216"/><path d="M133 216H202"/><g stroke="none" fill="currentColor"><rect x="250" y="277" width="88" height="22"/><rect x="250" y="320" width="88" height="22"/></g></svg>
    <span class="brand-name">tyro<span class="dot">.</span>cell</span>
  </a>
  <span class="eyebrow" id="eyebrow">Learn</span>
</div>

<div class="stage">
  <div class="formula-bar">
    <span class="fx">fx</span>
    <div class="formula-text" id="formulaText"></div>
  </div>

  <div class="sheet-area" id="sheetArea">
    <div class="cursor-layer">
      <div class="anim-cursor" id="cursor">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M5.5 3.2L20.3 12.9L12.7 13.8L9.2 20.5L5.5 3.2Z" fill="var(--ink)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <table class="sheet" id="sheet"></table>
  </div>

  <div class="subtitle-area">
    <p class="subtitle-text" id="subtitle"></p>
  </div>

  <div class="transport">
    <button class="play-btn" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    </button>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="step-label" id="stepLabel">0 / 0</span>
    <button class="speed-btn" id="speedBtn">1&times;</button>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function(){
  const hash = location.hash.replace(/^#/,'');
  const params = new URLSearchParams(location.search);
  const fn = (hash || params.get('fn') || '').toLowerCase().replace(/[^a-z0-9_]/g,'');

  if (!fn) {
    document.getElementById('sheetArea').innerHTML =
      '<div class="error-msg">No formula specified.<br>Use <code>#vlookup</code> in the URL.</div>';
    return;
  }

  const script = document.createElement('script');
  script.src = 'formulas/' + fn + '.js';
  script.onload = function() {
    if (window.FORMULA_CONFIG) {
      ExplainerEngine.init(window.FORMULA_CONFIG);
    } else {
      document.getElementById('sheetArea').innerHTML =
        '<div class="error-msg">Config for <code>' + fn + '</code> did not export FORMULA_CONFIG.</div>';
    }
  };
  script.onerror = function() {
    document.getElementById('sheetArea').innerHTML =
      '<div class="error-msg">Could not load explainer for <code>' + fn + '</code>.<br>File not found.</div>';
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
