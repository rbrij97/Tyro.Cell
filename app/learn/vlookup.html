<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLOOKUP — tyro.cell Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF9; --ink:#17191C; --text-1:#40474F; --text-2:#5F646B; --text-3:#6B7076;
  --muted:#9A9EA4; --hint:#B9BCC1;
  --line-1:#EBE8E4; --line-2:#EFECE8; --line-3:#F3F1ED; --line-4:#E4E1DC;
  --green:#16A05C; --green-dark:#0B6E3E; --green-tint:#F2FAF5; --green-select:#CDEFDC;
  --amber:#946200; --amber-tint:#FDF6E3; --amber-line:#E8C77D;
  --blue:#2563EB; --blue-tint:#EFF6FF;
  --red:#A4463C; --red-tint:#FBEFEC;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Consolas','Menlo',monospace;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;align-items:center;
  padding:32px 20px 20px;overflow-x:hidden;
}

/* --- Top nav --- */
.topnav{
  display:flex;align-items:center;gap:10px;width:100%;max-width:800px;margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;letter-spacing:-.2px;cursor:pointer;text-decoration:none;color:var(--ink)}
.brand-mark{display:block;flex:none}
.brand .dot{color:var(--muted);font-weight:500}
.topnav .eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:auto}

/* --- Stage --- */
.stage{
  width:100%;max-width:800px;
  background:#fff;border:1px solid var(--line-1);border-radius:var(--r-lg);
  overflow:hidden;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);
}

/* --- Formula bar --- */
.formula-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;border-bottom:1px solid var(--line-1);
  background:var(--paper);min-height:48px;
}
.formula-bar .fx{
  font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;
  background:var(--line-3);padding:3px 7px;border-radius:4px;flex-shrink:0;
}
.formula-bar .formula-text{
  font:500 14px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;
  min-height:20px;
}
.formula-bar .formula-text .typing-cursor{
  display:inline-block;width:2px;height:16px;background:var(--green);
  vertical-align:text-bottom;animation:blink .6s step-end infinite;margin-left:1px;
}
@keyframes blink{50%{opacity:0}}

/* Syntax coloring */
.f-fn{color:var(--green);font-weight:700}
.f-ref{color:var(--blue)}
.f-num{color:var(--amber)}
.f-str{color:var(--red)}
.f-dim{color:var(--hint)}

/* --- Sheet area --- */
.sheet-area{
  padding:24px 20px;position:relative;overflow-x:auto;
}
.sheet{
  width:100%;border-collapse:collapse;
  font:400 13.5px var(--mono);font-variant-numeric:tabular-nums;
}
.sheet th{
  font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);background:var(--paper);padding:7px 14px;
  border:1px solid var(--line-1);text-align:center;
}
.sheet th.rh{width:32px;color:var(--hint);font-size:10px}
.sheet td{
  padding:9px 14px;border:1px solid var(--line-1);background:#fff;
  transition:background .5s ease,box-shadow .5s ease,color .4s ease;
  position:relative;white-space:nowrap;
}
.sheet td.col-a{font-weight:600;color:var(--ink)}

/* Gap row */
.sheet .gap-row td{border:none;background:transparent;padding:6px 0}

/* --- Cell animation states --- */
.sheet td.searching{
  background:var(--blue-tint);
  box-shadow:inset 0 0 0 2px var(--blue);
  transition:background .25s,box-shadow .25s;
}
.sheet td.not-match{
  background:#fff;
  box-shadow:none;
  transition:background .3s .15s,box-shadow .2s;
}
.sheet td.found{
  background:var(--green-tint);
  box-shadow:inset 0 0 0 2.5px var(--green),0 0 16px rgba(22,160,92,.15);
  color:var(--green-dark);font-weight:700;
}
.sheet td.col-highlight{
  background:var(--amber-tint);
  box-shadow:inset 0 0 0 1.5px var(--amber-line);
}
.sheet td.result-glow{
  background:var(--green-tint);
  box-shadow:inset 0 0 0 2.5px var(--green),0 0 20px rgba(22,160,92,.2);
  color:var(--green-dark);font-weight:700;
}
.sheet td.lookup-hl{
  background:var(--amber-tint);
  box-shadow:inset 0 0 0 2px var(--amber-line);
}
.sheet td.range-hl{
  box-shadow:inset 0 0 0 1px rgba(37,99,235,.3);
}
.sheet td.target-cell{
  background:var(--line-3);
}

/* --- Animated cursor --- */
.cursor-layer{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:10;
}
.anim-cursor{
  position:absolute;width:20px;height:20px;
  opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}
.anim-cursor.visible{opacity:1}
.anim-cursor svg{width:20px;height:20px}

/* --- Value float animation --- */
.float-val{
  position:absolute;
  font:700 14px var(--mono);color:var(--green-dark);
  pointer-events:none;z-index:20;
  opacity:0;
}
.float-val.animating{
  opacity:1;
  transition:transform .8s cubic-bezier(.34,.01,.21,1),opacity .6s ease;
}
.float-val.fade-out{
  opacity:0;
  transition:opacity .3s ease;
}

/* --- Subtitle --- */
.subtitle-area{
  padding:20px 28px;min-height:80px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-top:1px solid var(--line-1);background:var(--paper);
}
.subtitle-text{
  font:400 15px/1.65 var(--sans);color:var(--text-1);max-width:620px;
  opacity:0;transform:translateY(6px);
  transition:opacity .4s ease,transform .4s ease;
}
.subtitle-text.visible{opacity:1;transform:translateY(0)}

/* --- Transport --- */
.transport{
  padding:14px 20px;display:flex;align-items:center;gap:14px;
  border-top:1px solid var(--line-1);
}
.play-btn{
  width:38px;height:38px;border-radius:50%;border:none;
  background:var(--green);color:#fff;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .12s;
}
.play-btn:hover{background:var(--green-dark)}
.play-btn:active{transform:scale(.93)}
.play-btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.play-btn svg{width:16px;height:16px;fill:currentColor;pointer-events:none}

.progress-track{
  flex:1;height:5px;background:var(--line-2);border-radius:3px;
  overflow:hidden;cursor:pointer;position:relative;
}
.progress-fill{
  height:100%;background:var(--green);border-radius:3px;
  width:0%;transition:width .35s ease;
}

.step-label{
  font:500 12px var(--mono);color:var(--muted);flex-shrink:0;
  min-width:56px;text-align:right;font-variant-numeric:tabular-nums;
}
.speed-btn{
  background:none;border:1px solid var(--line-4);color:var(--text-2);
  font:600 11px var(--mono);padding:4px 10px;border-radius:var(--r-pill);
  cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s;
}
.speed-btn:hover{color:var(--ink);border-color:var(--muted)}
.speed-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* --- Responsive --- */
@media(max-width:580px){
  body{padding:16px 12px 12px}
  .stage{border-radius:var(--r-md)}
  .sheet{font-size:12px}
  .sheet td,.sheet th{padding:7px 8px}
  .formula-bar{padding:10px 14px}
  .formula-bar .formula-text{font-size:12.5px}
  .subtitle-text{font-size:14px}
  .sheet-area{padding:16px 12px}
}
@media(prefers-reduced-motion:reduce){
  .sheet td,.subtitle-text,.anim-cursor,.progress-fill,.float-val{transition:none!important}
  .formula-bar .typing-cursor{animation:none}
}
</style>

<div class="topnav">
  <a class="brand" href="../index.html" target="_top">
    <svg class="brand-mark" viewBox="124 136 366 280" height="20" width="26" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" aria-hidden="true"><rect x="202" y="216" width="270" height="182"/><path d="M193 145V216"/><path d="M133 216H202"/><g stroke="none" fill="currentColor"><rect x="250" y="277" width="88" height="22"/><rect x="250" y="320" width="88" height="22"/></g></svg>
    <span class="brand-name">tyro<span class="dot">.</span>cell</span>

<div class="stage">
  <div class="formula-bar">

    <div class="formula-text" id="formulaText"></div>
  </div>

  <div class="sheet-area" id="sheetArea">
    <div class="cursor-layer" id="cursorLayer">

          <path d="M5.5 3.2L20.3 12.9L12.7 13.8L9.2 20.5L5.5 3.2Z" fill="var(--ink)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <div class="subtitle-area">

  <div class="transport">

      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>

      <div class="progress-fill" id="progressFill"></div>

<script>
const synth = window.speechSynthesis;
let speed = 1, playing = false, currentStep = -1, stepTimer = null;
let bestVoice = null;

// Pick the best available voice
function pickVoice() {
  const v = synth.getVoices();
  bestVoice =
    v.find(x => /Google.*Female/i.test(x.name) && x.lang.startsWith('en')) ||
    v.find(x => /Google/i.test(x.name) && x.lang.startsWith('en')) ||
    v.find(x => x.lang === 'en-IN' && !/Male/i.test(x.name)) ||
    v.find(x => x.lang === 'en-IN') ||
    v.find(x => x.lang.startsWith('en-GB') && !/Male/i.test(x.name)) ||
    v.find(x => x.lang.startsWith('en-US') && !/Male/i.test(x.name)) ||
    v.find(x => x.lang.startsWith('en')) ||
    null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

const $ = id => document.getElementById(id);
const qAll = s => document.querySelectorAll(s);

const formulaText = $('formulaText');
const subtitle = $('subtitle');
const playBtn = $('playBtn');
const playIcon = $('playIcon');
const progressFill = $('progressFill');
const stepLabel = $('stepLabel');
const cursor = $('cursor');
const sheetArea = $('sheetArea');
const f2Cell = $('f2');

// --- Cursor movement ---
function moveCursor(targetEl, offsetX = 10, offsetY = 10) {
  if (!targetEl) return;
  const area = sheetArea.getBoundingClientRect();
  const r = targetEl.getBoundingClientRect();
  const x = r.left - area.left + offsetX;
  const y = r.top - area.top + offsetY;
  cursor.style.transition = 'left .6s cubic-bezier(.25,.1,.25,1), top .6s cubic-bezier(.25,.1,.25,1)';
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
  cursor.classList.add('visible');
}

function hideCursor() { cursor.classList.remove('visible'); }

// --- Typing animation ---
function typeFormula(html, ms = 40) {
  return new Promise(resolve => {
    formulaText.innerHTML = '';
    const temp = document.createElement('div');
    temp.innerHTML = html;
    const fullText = temp.textContent;
    let i = 0;
    const timer = setInterval(() => {
      i++;
      // Rebuild with spans by inserting chars up to i
      formulaText.innerHTML = html.replace(/>[^<]*/g, (match) => {
        const text = match.slice(1);
        const chars = text.split('');
        let out = '>';
        for (const ch of chars) {
          if (i > 0) { out += ch; i--; }
        }
        return out;
      });
      if (i <= 0 || formulaText.textContent.length >= fullText.length) {
        clearInterval(timer);
        formulaText.innerHTML = html;
        resolve();
      }
    }, ms / speed);
  });
}

function setFormula(html) { formulaText.innerHTML = html; }

// --- Float value animation ---
function floatValue(fromEl, toEl, text) {
  return new Promise(resolve => {
    const area = sheetArea.getBoundingClientRect();
    const from = fromEl.getBoundingClientRect();
    const to = toEl.getBoundingClientRect();

    const floater = document.createElement('div');
    floater.className = 'float-val';
    floater.textContent = text;
    floater.style.left = (from.left - area.left + from.width/2) + 'px';
    floater.style.top = (from.top - area.top + from.height/2 - 8) + 'px';
    sheetArea.appendChild(floater);

    requestAnimationFrame(() => {
      floater.classList.add('animating');
      const dx = (to.left - from.left) + (to.width - from.width)/2;
      const dy = (to.top - from.top);
      floater.style.transform = `translate(${dx}px, ${dy}px)`;
    });

    setTimeout(() => {
      floater.classList.remove('animating');
      floater.classList.add('fade-out');
      setTimeout(() => { floater.remove(); resolve(); }, 300);
    }, 900 / speed);
  });
}

// --- Narration ---
function speak(text) {
  return new Promise(resolve => {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92 * speed;
    u.pitch = 1.08;
    u.lang = 'en-IN';
    if (bestVoice) u.voice = bestVoice;

    let done = false;
    const finish = () => { if (!done) { done = true; clearInterval(keepAlive); clearTimeout(fallback); resolve(); } };

    u.onend = finish;
    u.onerror = finish;
    synth.speak(u);

    // Chrome bug: synth stops after 15s, keep it alive
    const keepAlive = setInterval(() => {
      if (!synth.speaking) { clearInterval(keepAlive); return; }
      synth.pause(); synth.resume();
    }, 10000);

    // Fallback: if TTS never fires onend, advance after estimated duration
    const wordCount = text.split(/\s+/).length;
    const estimatedMs = Math.max(2000, (wordCount / 2.5) * 1000) / speed;
    const fallback = setTimeout(finish, estimatedMs + 500);
  });
}

function showSubtitle(text) {
  subtitle.classList.remove('visible');
  setTimeout(() => {
    subtitle.textContent = text;
    subtitle.classList.add('visible');
  }, 80);
}

// --- Cell helpers ---
const dataCells = ['a2','b2','c2','a3','b3','c3','a4','b4','c4','a5','b5','c5','a6','b6','c6'];
const allStates = ['searching','not-match','found','col-highlight','result-glow','lookup-hl','range-hl','target-cell'];

function clearCells() {
  dataCells.forEach(id => { const el = $(id); if(el) allStates.forEach(s => el.classList.remove(s)); });
  allStates.forEach(s => { $('e2')?.classList.remove(s); f2Cell?.classList.remove(s); });
  f2Cell.classList.add('target-cell');
}

function wait(ms) { return new Promise(r => setTimeout(r, ms / speed)); }

// --- Steps ---
const steps = [
  // 0: Intro
  async () => {
    hideCursor();
    showSubtitle("Let's learn VLOOKUP — the most-used lookup function in Excel. You have a ticker master with stock prices, and you need to pull a specific stock's CMP.");
    await speak("Let's learn V-Lookup — the most used lookup function in Excel. You have a ticker master with stock prices, and you need to pull a specific stock's C-M-P.");
  },
  // 1: Show the question
  async () => {
    moveCursor($('e2'), 30, 12);
    showSubtitle('The task: look up "HDFCBANK" from cell E2 and find its current market price from the table on the left.');
    $('e2').classList.add('lookup-hl');
    moveCursor(f2Cell, 30, 12);
    await wait(600);
    showSubtitle('The task: look up "HDFCBANK" from cell E2 and find its current market price from the table on the left.');
    await speak('The task: look up HDFC Bank from cell E2, and find its current market price from the table on the left.');
  },
  // 2: Start building formula — function name
  async () => {
    moveCursor(f2Cell, 30, 12);
    showSubtitle('Click on cell F2 and start typing the formula. VLOOKUP takes 4 arguments.');
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="typing-cursor"></span>');
    await speak('Click on cell F2 and start typing the formula. V-Lookup takes four arguments.');
  },
  // 3: Arg 1 — lookup value
  async () => {
    moveCursor($('e2'), 30, 12);
    $('e2').classList.add('lookup-hl');
    showSubtitle('First argument: the lookup value. Click cell E2 — that\'s "HDFCBANK", the ticker we\'re searching for.');
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="f-ref">E2</span><span class="f-dim">,</span><span class="typing-cursor"></span>');
    await speak('First argument: the lookup value. Click cell E2 — that\'s HDFC Bank, the ticker we\'re searching for.');
  },
  // 4: Arg 2 — table array
  async () => {
    moveCursor($('a2'), 8, 8);
    await wait(400);
    dataCells.forEach(id => $(id)?.classList.add('range-hl'));
    showSubtitle('Second: the table array. Select A2 to C6 — the entire data table. The lookup column must be the FIRST column of this range.');
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="f-ref">E2</span><span class="f-dim">,</span> <span class="f-ref">A2:C6</span><span class="f-dim">,</span><span class="typing-cursor"></span>');
    moveCursor($('c6'), 40, 12);
    await speak('Second: the table array. Select A2 to C6 — the entire data table. The lookup column must always be the first column of this range.');
  },
  // 5: Arg 3 — column index
  async () => {
    ['b2','b3','b4','b5','b6'].forEach(id => $(id)?.classList.add('col-highlight'));
    moveCursor($('b1'), 30, 12);
    showSubtitle('Third: column index number. We want CMP, which is column B — the 2nd column in our range A to C. So we type 2.');
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="f-ref">E2</span><span class="f-dim">,</span> <span class="f-ref">A2:C6</span><span class="f-dim">,</span> <span class="f-num">2</span><span class="f-dim">,</span><span class="typing-cursor"></span>');
    await speak('Third: column index number. We want C-M-P, which is column B — the second column in our range A to C. So we type 2.');
  },
  // 6: Arg 4 — FALSE
  async () => {
    hideCursor();
    showSubtitle('Fourth: FALSE for exact match. This tells Excel to find the EXACT ticker, not an approximate one. You\'ll use FALSE 99% of the time.');
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="f-ref">E2</span><span class="f-dim">,</span> <span class="f-ref">A2:C6</span><span class="f-dim">,</span> <span class="f-num">2</span><span class="f-dim">,</span> <span class="f-str">FALSE</span><span class="f-fn">)</span>');
    await speak('Fourth: FALSE for exact match. This tells Excel to find the exact ticker, not an approximate one. You\'ll use FALSE ninety-nine percent of the time.');
  },
  // 7: Search begins
  async () => {
    clearCells();
    $('e2').classList.add('lookup-hl');
    showSubtitle('Now press Enter. Excel starts searching down column A, comparing each cell to "HDFCBANK"...');
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="f-ref">E2</span><span class="f-dim">,</span> <span class="f-ref">A2:C6</span><span class="f-dim">,</span> <span class="f-num">2</span><span class="f-dim">,</span> <span class="f-str">FALSE</span><span class="f-fn">)</span>');
    await speak('Now press Enter. Excel starts searching down column A, comparing each cell to HDFC Bank.');
  },
  // 8: Row 2 — RELIANCE
  async () => {
    moveCursor($('a2'), 30, 12);
    $('a2').classList.add('searching');
    showSubtitle('Row 2: RELIANCE — not a match.');
    await speak('Row 2: Reliance. Not a match.');
    await wait(300);
    $('a2').classList.remove('searching');
    $('a2').classList.add('not-match');
  },
  // 9: Row 3 — TCS
  async () => {
    moveCursor($('a3'), 30, 12);
    $('a3').classList.add('searching');
    showSubtitle('Row 3: TCS — not a match.');
    await speak('Row 3: T-C-S. Not a match.');
    await wait(300);
    $('a3').classList.remove('searching');
    $('a3').classList.add('not-match');
  },
  // 10: Row 4 — HDFCBANK — FOUND
  async () => {
    moveCursor($('a4'), 30, 12);
    $('a4').classList.add('searching');
    showSubtitle('Row 4: HDFCBANK — match found!');
    await wait(500);
    $('a4').classList.remove('searching');
    $('a4').classList.add('found');
    await speak('Row 4: HDFC Bank — match found!');
  },
  // 11: Move to column 2
  async () => {
    moveCursor($('b4'), 30, 12);
    $('b4').classList.add('result-glow');
    showSubtitle('Excel moves across to column 2 — the CMP column — and finds the value: 1,685.');
    await speak('Excel moves across to column 2 — the C-M-P column — and finds the value: sixteen eighty-five.');
  },
  // 12: Float value to result
  async () => {
    showSubtitle('The value 1,685 flows back to cell F2. VLOOKUP returns the answer!');
    await floatValue($('b4'), f2Cell, '1,685');
    f2Cell.textContent = '1,685';
    f2Cell.style.color = 'var(--green-dark)';
    f2Cell.style.fontStyle = 'normal';
    f2Cell.style.fontWeight = '700';
    f2Cell.classList.remove('target-cell');
    f2Cell.classList.add('result-glow');
    moveCursor(f2Cell, 30, 12);
    await speak('The value sixteen eighty-five flows back to cell F2. V-Lookup returns the answer!');
  },
  // 13: Recap
  async () => {
    hideCursor();
    setFormula('<span class="f-fn">=VLOOKUP(</span><span class="f-ref">E2</span><span class="f-dim">,</span> <span class="f-ref">A2:C6</span><span class="f-dim">,</span> <span class="f-num">2</span><span class="f-dim">,</span> <span class="f-str">FALSE</span><span class="f-fn">)</span> <span style="color:var(--green);font-weight:600">→ 1,685</span>');
    showSubtitle('That\'s VLOOKUP! Lookup value, table range (search column first), column number to return, and FALSE for exact match. Now go practice it!');
    await speak("That's V-Lookup! Lookup value, table range with the search column first, column number to return, and FALSE for exact match. Now go practice it!");
  },
];

// --- Player logic ---
function updateProgress() {
  const pct = steps.length > 0 ? ((currentStep + 1) / steps.length) * 100 : 0;
  progressFill.style.width = pct + '%';
  stepLabel.textContent = `${Math.max(0, currentStep + 1)} / ${steps.length}`;
}

function resetAll() {
  clearCells();
  f2Cell.textContent = '?';
  f2Cell.style.color = 'var(--hint)';
  f2Cell.style.fontStyle = 'italic';
  f2Cell.style.fontWeight = '';
  f2Cell.classList.add('target-cell');
  formulaText.innerHTML = '';
  subtitle.textContent = '';
  subtitle.classList.remove('visible');
  hideCursor();
  currentStep = -1;
  updateProgress();
}

async function runStep(idx) {
  if (idx >= steps.length || !playing) {
    playing = false;
    playIcon.innerHTML = '<polygon points="6,3 20,12 6,21"/>';
    return;
  }
  currentStep = idx;
  updateProgress();
  await steps[idx]();
  await wait(600); // breathing room between steps
  if (playing) runStep(idx + 1);
}

function togglePlay() {
  if (playing) {
    playing = false;
    synth.cancel();
    playIcon.innerHTML = '<polygon points="6,3 20,12 6,21"/>';
  } else {
    playing = true;
    playIcon.innerHTML = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';
    if (currentStep >= steps.length - 1) resetAll();
    runStep(currentStep + 1);
  }
}

playBtn.addEventListener('click', togglePlay);

// Speed toggle
const speeds = [1, 1.5, 2, 0.75];
let speedIdx = 0;
$('speedBtn').addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  speed = speeds[speedIdx];
  $('speedBtn').innerHTML = speed + '&times;';
});

// Progress bar click
$('progressTrack').addEventListener('click', async (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const target = Math.min(Math.floor(pct * steps.length), steps.length - 1);
  synth.cancel();
  playing = false;
  playIcon.innerHTML = '<polygon points="6,3 20,12 6,21"/>';
  resetAll();
  // Fast-forward to target step (run each without speech)
  for (let i = 0; i <= target; i++) {
    currentStep = i;
    // Execute the visual side-effects but skip speech
    const origSpeak = window.speak;
    // We just set the state visually
  }
  currentStep = target;
  updateProgress();
});

updateProgress();
</script>
